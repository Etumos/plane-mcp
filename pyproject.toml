[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plane-project-mcp"
version = "0.1.1"
description = "MCP server for Plane (project management) — list/create/update issues and projects from any MCP client"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "plane-mcp contributors" }
]
keywords = ["mcp", "model-context-protocol", "plane", "project-management"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
http = [
    "uvicorn>=0.30.0",
    "starlette>=0.37.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/Etumos/plane-project-mcp"
Repository = "https://github.com/Etumos/plane-project-mcp"
Issues = "https://github.com/Etumos/plane-project-mcp/issues"

[project.scripts]
plane-project-mcp = "plane_mcp.server:cli"

[tool.hatch.build.targets.wheel]
packages = ["plane_mcp"]
